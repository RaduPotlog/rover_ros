/**:
  ros__parameters:
    use_stamped: true
    topics:
      # Nav 2 autonomy (orchestrator computer). Lowest, so any teleop source preempts it.
      nav:
        topic   : nav_cmd_vel_stamped
        timeout : 0.5
        priority: 5
      # Driver UI, via rover_command_freshness_node, which drops commands the websocket
      # delivered late after a Wi-Fi stall. 0.3 s = three periods of the UI's 10 Hz stream.
      driver_interface:
        topic   : teleop_driver_interface_cmd_vel_fresh_stamped
        timeout : 0.3
        priority: 8
      joystick:
        topic   : teleop_foxglove_cmd_vel_stamped
        timeout : 0.5
        priority: 100
      # ELRS RC transmitter: line-of-sight operator has the last word.
      cmd_elrs:
        topic   : teleop_elrs_cmd_vel_stamped
        timeout : 0.5
        priority: 110

    # Fed by rover_motion_lock_node (10 Hz). An input is masked when its priority is below
    # the lock's, so 200 stops everything on E-Stop; use 7 to gate only nav.
    # A stale lock counts as locked, so if the node dies the mux closes.
    locks:
      motion_lock:
        topic   : motion_lock
        timeout : 0.5
        priority: 200
