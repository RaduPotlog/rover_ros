/**:
  ros__parameters:
    use_stamped: true
    topics:
      cmd_elrs:
        topic   : teleop_elrs_cmd_vel_stamped
        timeout : 0.5
        priority: 10
      joystick:
        topic   : teleop_foxglove_cmd_vel_stamped
        timeout : 0.5
        priority: 100
      # Nav2 autonomy, running on the separate orchestrator computer. Lowest
      # priority, so either teleop source preempts it deterministically rather
      # than the two racing each other on /cmd_vel. The 0.5 s timeout also makes
      # a LAN partition a defined transition: the nav input goes stale and the
      # mux falls through, instead of relying on the drive controller's own
      # cmd_vel_timeout as a backstop.
      nav:
        topic   : nav_cmd_vel_stamped
        timeout : 0.5
        priority: 5

    # Safety lock, fed by motion_lock_node from hardware_interface/gpio_state.
    #
    # twist_mux masks an input when `input priority < active lock priority` (strictly), so
    # priority 200 outranks all three inputs above and stops the rover outright while any
    # E-Stop condition is active. To gate autonomy ONLY and leave both teleop sources free,
    # drop this to 7 (above nav's 5, below cmd_elrs's 10).
    #
    # The timeout is what makes this fail-safe: twist_mux treats a stale lock topic as LOCKED
    # (isLocked() == hasExpired() || data), so if motion_lock_node dies the mux closes rather
    # than opens. motion_lock_node republishes at 10 Hz to stay well inside this window.
    locks:
      motion_lock:
        topic   : motion_lock
        timeout : 0.5
        priority: 200
