# Configuration for ament_cmake_cpplint (see cpplint.py's module docstring for the full key
# reference). Applies to this directory and all subdirectories.
set noparent

# build/header_guard: this project's header guards (ROVER_HARDWARE_INTERFACE_<PATH>_HPP_) are
# self-consistent but don't match cpplint's specific naming algorithm for .hpp files, causing a
# false positive on every header.
# whitespace/blank_line: this project deliberately keeps a blank line after "public:"/"protected:"
# for readability; that is a house-style choice, not a defect.
# whitespace/line_length: this project doesn't cap line length at cpplint's 80-column default
# (e.g. RCLCPP_* log statements and long throw-message expressions regularly run to ~150-160
# columns); no fixed threshold captures that without still flagging genuine outliers.
filter=-build/header_guard,-whitespace/blank_line,-whitespace/line_length
