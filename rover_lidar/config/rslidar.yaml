# rover_rslidar_sdk driver configuration (RoboSense RS16).
#
# NOTE: this is *not* a ROS parameter file. rover_rslidar_sdk_node reads exactly one ROS
# parameter - `config_path` - and parses this whole file itself with yaml-cpp. The launch file
# passes the path; keep the schema identical to the upstream
# rover_rslidar_sdk/config/config.yaml, otherwise the driver aborts on startup.
#
# `<namespace>/` is replaced by the launch file (nav2_common ReplaceString) with the rover
# namespace plus a slash, or with nothing when unnamespaced - the same idiom
# rover_controller uses for its controller config.

common:
  msg_source: 1                 # 1: online lidar, 2: from ROS packets, 3: pcap replay
  send_packet_ros: false        # raw MSOP/DIFOP packets are only needed to record for replay
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RS16
      msop_port: 6699           # point data; the lidar must reach the rover on this UDP port
      difop_port: 7788          # device info (calibration, status)
      imu_port: 0               # 0 = off; the SDK is built with ENABLE_IMU_DATA_PARSE=OFF
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 100
      use_lidar_clock: false    # false = stamp with the rover's system clock
      dense_points: false       # keep invalid returns as NaN; pointcloud_to_laserscan drops them
      ts_first_point: true
      start_angle: 0
      end_angle: 360
    ros:
      # Must match the URDF frame from rover_description (robot_state_publisher publishes it
      # with the namespace as frame_prefix). Upstream default `rover_rslidar` exists in no TF tree.
      ros_frame_id: <namespace>/lidar_link
      # Relative on purpose: the launch namespace then resolves it to /<namespace>/rslidar_points.
      # The upstream default is absolute (/rslidar_points) and escapes the namespace.
      ros_send_point_cloud_topic: rslidar_points
      ros_recv_packet_topic: rslidar_packets
      ros_send_packet_topic: rslidar_packets
      ros_send_imu_data_topic: rslidar_imu_data
      # Upstream ships 1000, which is hundreds of MB of PointCloud2 buffer for no benefit.
      ros_queue_length: 10
