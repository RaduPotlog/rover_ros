panels:
  - channel: 1
    number_of_leds: 40
  - channel: 2
    number_of_leds: 40
segments:
  - name: front_1
    channel: 1
    led_range: 0-19
  - name: front_2
    channel: 1
    led_range: 39-20
  - name: rear_1
    channel: 2
    led_range: 0-19
  - name: rear_2
    channel: 2
    led_range: 39-20

segments_map:
  all: [front_1, front_2, rear_1, rear_2,]

led_animations:
  - id: 0
    name: E_STOP
    priority: 3
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/e_stop.png
          duration: 6
      
  - id: 1
    name: READY
    priority: 3
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/ready.png
          duration: 6
      
  - id: 2
    name: ERROR
    priority: 0
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/error.png
          duration: 2
          repeat: 2

  - id: 3
    name: NO_ERROR
    priority: 0
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/empty.png
          duration: 1
          repeat: 1

  # Shown while the robot is driven. Same steady glow as READY, tinted blue.
  - id: 4
    name: MANUAL_ACTION
    priority: 3
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/ready.png
          duration: 6
          color: 0x0080FF

  - id: 5
    name: LOW_BATTERY
    priority: 2
    animations:
      - type: rover_led::MovingImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/low_battery.png
          duration: 10
          repeat: 1
          center_offset: 24
          object_width: 2
          splash_duration: 10.0

  - id: 6
    name: CRITICAL_BATTERY
    priority: 2
    animations:
      - type: rover_led::MovingImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/critical_battery.png
          duration: 10
          repeat: 1
          center_offset: 24
          object_width: 2
          splash_duration: 10.0

  - id: 7
    name: CHARGING_BATTERY
    priority: 2
    animations:
      - type: rover_led::MovingImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/charging_battery.png
          duration: 10
          repeat: 1
          center_offset: 38
          object_width: 1
          splash_duration: 10.0

  - id: 8
    name: BATTERY_CHARGED
    priority: 2
    animations:
      - type: rover_led::MovingImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/battery_charged.png
          duration: 10
          repeat: 1
          center_offset: 38
          object_width: 1
          splash_duration: 10.0

  - id: 9
    name: CHARGER_INSERTED
    priority: 1
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/charger_inserted.png
          duration: 8

  - id: 10
    name: BATTERY_NOMINAL
    priority: 2
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/empty.png
          duration: 1
          repeat: 1