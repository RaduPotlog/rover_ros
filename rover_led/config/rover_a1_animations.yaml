# Panther-style layout: one full-width segment per bumper.
# Both bumpers are 2 rows x 20 LEDs wired in series, with LED 0 on the robot's right:
#   front = channel 1, seen from the front:  0 ... 19  over  39 ... 20
#   rear  = channel 2, seen from behind:    19 ...  0  over  20 ... 39
# "rows: 2" folds each 40-LED segment into that layout: segment LEDs 2k and 2k+1
# are the two LEDs of column k counted from the robot's right. So on both bumpers
# segment LED 0 is the robot's right, and one image works for both.
panels:
  - channel: 1
    number_of_leds: 40
    rows: 2
  - channel: 2
    number_of_leds: 40
    rows: 2

segments:
  - name: front
    channel: 1
    led_range: 39-0
  - name: rear
    channel: 2
    led_range: 0-39

segments_map:
  all: [front, rear]
  front: [front]
  rear: [rear]

led_animations:
  - id: 0
    name: E_STOP
    priority: 3
    animations:
      - type: rover_led::ImageAnimation
        segments: front
        animation:
          image: $(find rover_led)/animations/rover_a1/estop_front.png
          duration: 4
      - type: rover_led::ImageAnimation
        segments: rear
        animation:
          image: $(find rover_led)/animations/rover_a1/estop_rear.png
          duration: 4

  - id: 1
    name: READY
    priority: 3
    animations:
      - type: rover_led::ImageAnimation
        segments: front
        animation:
          image: $(find rover_led)/animations/rover_a1/ready_front.png
          duration: 4
      - type: rover_led::ImageAnimation
        segments: rear
        animation:
          image: $(find rover_led)/animations/rover_a1/ready_rear.png
          duration: 4

  - id: 2
    name: ERROR
    priority: 0
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/error.png
          duration: 2
          repeat: 2

  - id: 3
    name: NO_ERROR
    priority: 0
    animations:
      - type: rover_led::ImageAnimation
        segments: all
        animation:
          image: $(find rover_led)/animations/rover_a1/empty.png
          duration: 1
          repeat: 1

  - id: 4
    name: MANUAL_ACTION
    priority: 3
    animations:
      - type: rover_led::ImageAnimation
        segments: front
        animation:
          image: $(find rover_led)/animations/rover_a1/manual_action_front.png
          duration: 6
      - type: rover_led::ImageAnimation
        segments: rear
        animation:
          image: $(find rover_led)/animations/rover_a1/manual_action_rear.png
          duration: 6

  - id: 5
    name: LOW_BATTERY
    priority: 2
    animations:
      - type: rover_led::MovingImageAnimation
        segments: front
        animation:
          image: $(find rover_led)/animations/rover_a1/low_battery.png
          duration: 10
          repeat: 1
          center_offset: 24
          object_width: 2
          splash_duration: 10.0
      - type: rover_led::MovingImageAnimation
        segments: rear
        animation:
          image: $(find rover_led)/animations/rover_a1/low_battery.png
          duration: 10
          repeat: 1
          center_offset: 24
          object_width: 2
          splash_duration: 10.0
          image_mirrored: true
          position_mirrored: true

  - id: 6
    name: CRITICAL_BATTERY
    priority: 2
    animations:
      - type: rover_led::MovingImageAnimation
        segments: front
        animation:
          image: $(find rover_led)/animations/rover_a1/critical_battery.png
          duration: 10
          repeat: 1
          center_offset: 24
          object_width: 2
          splash_duration: 10.0
      - type: rover_led::MovingImageAnimation
        segments: rear
