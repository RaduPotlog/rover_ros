# ROS parameters for rover_rs16_lidar_node - the one node in launch/rover_rs16_lidar.launch.py.
#
# Unlike the rover_lidar/rover_rslidar_sdk pair this replaces, there is a single configuration
# file and it is an ordinary ROS parameter file: the driver runs in-process, so there is no
# second yaml-cpp schema to keep in step with upstream.
#
# `<namespace>/` is replaced by the launch file with the rover namespace plus a slash, or with
# nothing when unnamespaced - the same idiom rover_controller uses.

/**/rover_rs16_lidar_node:
  ros__parameters:
    # Must match the URDF frame from rover_description (robot_state_publisher publishes it with
    # the namespace as frame_prefix).
    frame_id: <namespace>/lidar_link
    # Relative on purpose: the launch namespace resolves these to /<namespace>/...
    point_cloud_topic: rslidar_points
    scan_topic: scan
    publish_scan: true
    publisher_queue_size: 10        # a PointCloud2 is megabytes; do not buffer many

    # --- sensor ------------------------------------------------------------------------
    input_type: lidar               # 'lidar' reads the sensor, 'pcap' replays a capture
    msop_port: 6699                 # point data; the lidar must reach the rover on this UDP port
    difop_port: 7788                # device info (calibration, status)
    host_address: 0.0.0.0
    group_address: 0.0.0.0
    min_distance: 0.2
    max_distance: 100.0
    use_lidar_clock: false          # false = stamp with the rover's system clock
    dense_points: false             # keep invalid returns as NaN; the scan projector drops them
    ts_first_point: true
    wait_for_difop: true
    start_angle: 0.0
    end_angle: 360.0
    pcap_path: ""
    pcap_repeat: false
    pcap_rate: 1.0

    # --- LaserScan for the Nav 2 costmaps ----------------------------------------------
    scan:
      # Horizontal slice of the RS16's +/-15 deg fan, taken around the lidar's own origin.
      min_height: -0.25
      max_height: 0.25
      angle_min: -3.141592653589793
      angle_max: 3.141592653589793
      angle_increment: 0.008726646259971648   # 0.5 deg
      scan_time: 0.1                          # 10 Hz, the RS16 default spin rate
      range_min: 0.2
      range_max: 20.0        # costmap-sized, not the sensor's 100 m
      use_inf: true

    # --- health diagnostics ------------------------------------------------------------
    expected_rate_hz: 10.0
    min_rate_ratio: 0.5      # below 5 Hz is a warning
    cloud_timeout_s: 2.0     # no cloud for this long is an error (lidar unplugged / wrong subnet)
    min_points_warn: 1000    # a nearly empty cloud usually means a blocked or blinded sensor
    publish_frequency: 1.0
