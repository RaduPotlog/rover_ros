# wheel_radius is the effective rolling radius the diff_drive odometry is tuned on. Must match
# rover_controller/config/wheel_01_controller.yaml. Not used for geometry.
wheel_radius: 0.1651
# CAD tyre radius (meshes/wheel_01, SolidWorks export): the wheel collision cylinder and the
# height of base_link above base_footprint, so the tyres touch the ground plane.
tyre_radius: 0.1699
wheel_width: 0.108
# Mass, inertia and CoM of one WHEEL_CHUNK_1000_WATT_VARIANT (tyre + both flanges), computed from
# the SolidWorks part mass properties (2026-10-08).
mass: 4.79294
inertia: { ixx: 0.036460, iyy: 0.065711, izz: 0.036460 }
# CoM offset along the axle for the left wheels; the right wheels mirror it (inboard on both sides).
inertia_y_offset: -0.0026831
# Tread centre along the axle for the left wheels, mirrored on the right: the tyre sits 1.71 mm
# inboard of the CAD wheel joint (tread band of link_*.STL, SolidWorks export 2026-10-07). Offsets
# the collision cylinder so the contact patches are 0.6136 m apart, not wheel_separation.
tyre_y_offset: -0.00171
mesh_package: rover_description
folder_path: meshes/wheel_01
mecanum: False
wheelbase: 0.503
wheel_separation: 0.617
