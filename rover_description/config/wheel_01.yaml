# wheel_radius is the effective rolling radius the diff_drive odometry is tuned on. Must match
# rover_controller/config/wheel_01_controller.yaml. Not used for geometry.
wheel_radius: 0.1651
# CAD tyre radius (meshes/wheel_01, SolidWorks export): the wheel collision cylinder and the
# height of base_link above base_footprint, so the tyres touch the ground plane.
tyre_radius: 0.1699
wheel_width: 0.108
# Mass, inertia and CoM from the SolidWorks export
# (solidworks_exported/ROVER_1000_WATT_VARIANT.SLDASM/urdf/*.csv, WHEEL_CHUNK_1000_WATT_VARIANT).
mass: 5.0741
inertia: { ixx: 0.036669, iyy: 0.066215, izz: 0.036669 }
# CoM offset along the axle for the left wheels; the right wheels mirror it (inboard on both sides).
inertia_y_offset: -0.0024212
mesh_package: rover_description
folder_path: meshes/wheel_01
mecanum: False
wheelbase: 0.503
wheel_separation: 0.617
