safety:
  battery:
    temp:
      critical:
        type: double
        default_value: 50.0
        description: Battery temperature in degrees Celsius above which an overheating battery trips the e-stop. Must be lower than fatal.
        read_only: true
        validation: { bounds<>: [-20.0, 100.0] }

      fatal:
        type: double
        default_value: 60.0
        description: Battery temperature in degrees Celsius above which an overheating battery shuts the robot down.
        read_only: true
        validation: { bounds<>: [-20.0, 100.0] }

      window_len:
        type: int
        default_value: 6
        description: Moving average window length used to smooth out temperature readings of the battery.
        validation: { gt<>: 0 }

  bt_project_path:
    type: string
    default_value: ""
    description: Path to a BehaviorTree project.

  bt_server_port:
    type: int
    default_value: 6666
    description: Port number for the BehaviorTree server.
    validation: { gt<>: 0 }

  cpu:
    temp:
      fan_off:
        type: double
        default_value: 60.0
        description: Temperature in degrees Celsius of the Built-in Computer's CPU, below which the fan is turned off.
        validation: { bounds<>: [-20.0, 100.0] }

      fan_on:
        type: double
        default_value: 70.0
        description: Temperature in degrees Celsius of the Built-in Computer's CPU, above which the fan is turned on.
        validation: { bounds<>: [-20.0, 100.0] }

      window_len:
        type: int
        default_value: 6
        description: Moving average window length used to smooth out temperature readings of the Built-in Computer's CPU.
        validation: { gt<>: 0 }

  driver:
    temp:
      fan_off:
        type: double
        default_value: 35.0
        description: Temperature in degrees Celsius of any drivers below which the fan is turned off.
        validation: { bounds<>: [-20.0, 100.0] }

      fan_on:
        type: double
        default_value: 45.0
        description: Temperature in degrees Celsius of any drivers above which the fan is turned on.
        validation: { bounds<>: [-20.0, 100.0] }

      window_len:
        type: int
        default_value: 6
        description: Moving average window length used to smooth out the temperature readings of each driver.
        validation: { gt<>: 0 }

  fan_turn_off_timeout:
    type: double
    default_value: 60.0
    description: Minimal time in seconds, after which the fan may be turned off.
    validation: { gt<>: 0.0 }

  input_timeout:
    type: double
    default_value: 5.0
    description: Seconds after which a periodic safety input (battery_status, system_status) is reported stale on diagnostics.
    validation: { gt<>: 0.0 }

  plugin_libs:
    type: string_array
    default_value: []
    description: A list with names of plugins that are used in the a BehaviorTree project.

  ros_communication_timeout:
    availability:
      type: double
      default_value: 1.0
      description: Timeout seconds to wait for a service/action while initializing a BehaviorTree node.
      validation: { gt<>: 0.0 }

    response:
      type: double
      default_value: 1.0
      description: Timeout seconds to receive a service/action response after call.
      validation: { gt<>: 0.0 }

  ros_plugin_libs:
    type: string_array
    default_value: []
    description: A list with names of ROS plugins that are used in a BehaviorTree project.

  shutdown:
    bt_server_port:
      type: int
      default_value: 7777
      description: Port number for the BehaviorTree server of the shutdown tree.
      read_only: true
      validation: { gt<>: 0 }

    command:
      type: string
      default_value: ""
      description: Bash command that powers off the ROS controller, run as the last step of the shutdown tree. Empty runs the installed shutdown_ros_controller.sh with --no-e-stop. The shutdown reason is exported as ROVER_SHUTDOWN_REASON.
      read_only: true

    command_timeout:
      type: double
      default_value: 15.0
      description: Seconds after which the power-off command is killed and the shutdown reported as failed.
      read_only: true
      validation: { gt<>: 0.0 }

    retry_backoff:
      type: double
      default_value: 30.0
      description: Seconds after a failed shutdown during which new shutdown requests are refused.
      read_only: true
      validation: { gt_eq<>: 0.0 }

    service_enabled:
      type: bool
      default_value: true
      description: Whether to offer the ~/shutdown (std_srvs/Trigger) service that powers off the ROS controller.
      read_only: true

  shutdown_hosts_path:
    type: string
    default_value: ""
    description: Path to a YAML file listing the hosts to shut down before the ROS controller powers off. Empty or no hosts skips that step. See config/shutdown_hosts.yaml.

  timer_frequency:
    type: double
    default_value: 10.0
    description: Frequency in Hz at which safety tree will be ticked.
