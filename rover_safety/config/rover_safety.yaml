/**:
  rover_safety_node:
    ros__parameters:
      timer_frequency: 10.0
      bt_server_port: 6666
      input_timeout: 5.0
      autostart_node: true
      battery:
        temp:
          critical: 50.0
          fatal: 60.0
          window_len: 6
      cpu:
        temp:
          window_len: 6
          fan_on: 75.0
          fan_off: 70.0
      driver:
        temp:
          window_len: 6
          fan_on: 50.0
          fan_off: 45.0
      ros_communication_timeout:
        availability: 1.0
        response: 1.0
      shutdown:
        bt_server_port: 7777
        # Empty: run the installed shutdown_ros_controller.sh --no-e-stop.
        command: ""
        command_timeout: 15.0
        retry_backoff: 30.0
        service_enabled: true
      plugin_libs:
        - execute_command_bt_node
        - shutdown_hosts_from_file_bt_node
        - signal_shutdown_bt_node
        - tick_after_timeout_bt_node
      ros_plugin_libs:
        - call_set_bool_service_bt_node
        - call_trigger_service_bt_node
