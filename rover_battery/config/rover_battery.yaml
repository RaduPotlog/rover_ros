# Shared by both nodes in launch/rover_battery.launch.py.

# rover_udp_battery_receiver_node (rover_udp_driver): BMS bridge endpoint.
/**/rover_udp_battery_receiver_node:
  ros__parameters:
    ip: "192.168.1.201"
    port: 4444

/**/rover_battery_node:
  ros__parameters:
    design_capacity: 40.0          # [Ah]
    serial_number: "224KA141600043"
    watchdog_timeout_ms: 10000     # publish a watchdog-expired state after this long without BMS data
