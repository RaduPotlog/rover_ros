/**:
  ros__parameters:

    # --- CRSF receiver serial link -----------------------------------------------------------
    # The UART is owned by rover_serial_driver's rover_serial_bridge_node node, which this package's launch file
    # starts; this node only decodes the bytes that node publishes. serial_device and
    # serial_baudrate are read by the LAUNCH FILE and handed to the bridge, so changing them here
    # changes what the bridge opens.
    #
    # 460800 is what the A1's receiver is flashed for, and ASIO supports it natively
    # (asio/impl/serial_port_base.ipp -> B460800), which is why no custom-baudrate ioctl is
    # needed any more. CRSF's own default of 420000 is NOT in ASIO's table: if the receiver is
    # ever reflashed to 420000, rover_serial_bridge_node will not be able to open it at all. Keep it at
    # 460800.
    #
    # Prefer a stable path: `ls -l /dev/serial/by-id/`. ttyUSBn is assigned in enumeration order
    # and moves the moment another USB serial device is plugged in.
    serial_device: /dev/ttyUSB0
    serial_baudrate: 460800

    # Topic carrying raw bytes from rover_serial_bridge_node - its `serial_read`, remapped by the launch
    # file. Must match that remap. Subscribed with reliable QoS, depth 100: a dropped byte chunk
    # desynchronises the CRSF parser until the next sync byte, so the transport must not be what
    # drops it.
    serial_topic: rc/raw

    # Echo decoded frames on rc/channels (rover_msgs/RcChannels) and rc/link
    # (rover_msgs/RcLinkStatus). Nothing on the rover consumes them - teleop decodes in-process -
    # so they exist purely for tuning, for `ros2 bag` and for the Cockpit RC page (which redraws
    # at 10 Hz). They publish once per DECODED frame, capped at rc_topics_rate_hz each: the
    # receiver decodes ~250 frames/s and every echo crosses the Zenoh router. With the cap,
    # `ros2 topic hz /rover/rc/channels` shows the cap, not the receiver's packet rate - the
    # "RC channels rate" diagnostic still measures that. 0 = no cap.
    publish_rc_topics: true
    rc_topics_rate_hz: 25.0


    # Per-channel raw CRSF endpoints, index N-1 = channel N (channel 3 is the third entry).
    # A one-element list is expanded to all 16, which is both how a pre-array configuration
    # migrates and the honest way to say "nothing here has been measured yet".
    #
    # These are the NOMINAL endpoints from include/rover_crsf_teleop/domain/crsf/crsf_protocol.hpp.
    # They are a starting point, not a description of any particular transmitter: endpoints, trim
    # and expo move all three numbers. Measure the real ones with the calibration flow below - it
    # writes them to calibration_file, which overrides everything here, per channel.
    #
    # The midpoint matters most: the stick -> twist mapping is defined about it, so a centred
    # stick produces exactly 0.0. Only the channels named under "Stick axes" are read per tick;
    # the rest are carried so a calibration can be measured, stored and displayed whole.
    #                  ch1   ch2   ch3   ch4   ch5   ch6   ch7   ch8   ch9  ch10  ch11  ch12  ch13  ch14  ch15  ch16
    channel_in_min:  [  172,  172,  172,  172,  172,  172,  172,  172,  172,  172,  172,  172,  172,  172,  172,  172]
    channel_in_mid:  [  992,  992,  992,  992,  992,  992,  992,  992,  992,  992,  992,  992,  992,  992,  992,  992]
    channel_in_max:  [ 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811, 1811]

    # Half-width, in raw counts, of the band around channel_in_mid that maps to exactly 0.0.
    # Size it against where the stick actually RESTS, not against frame noise: on this
    # transmitter ch3 rests at 1004 and ch1 at 987, 12 and 5 counts off the nominal 992 midpoint.
    # A deadband narrower than that leaves a permanent creep command, which makes the hardware
    # interface's E-Stop reset invariant ("velocity commands are not zero") unsatisfiable.
    #
    # 30 counts is the value that had to cover BOTH sticks back when there was a single global
    # midpoint. Calibrating removes that constraint: each channel gets a midpoint of its own, so
    # its deadband only has to cover its own jitter - typically 8-15 counts, which is resolution
    # handed back at centre.
    channel_deadband: [   30,   30,   30,   30,   30,   30,   30,   30,   30,   30,   30,   30,   30,   30,   30,   30]

    # Where a measured calibration is kept between runs. It OVERRIDES the four arrays above when
    # it loads, and which source is in force is logged at startup and reported by the
    # "RC calibration" diagnostic - it is never a guess. Delete the file to come back to the
    # values above.
    #
    # /config is a balena named volume (see rover_docker/docker-compose.yml): a balenaOS device
    # filesystem is read-only outside it. Leave this empty to turn persistence off - a
    # calibration can still be measured and applied, it just will not survive a restart.
    calibration_file: /config/rover_crsf_teleop/rc_calibration.yaml

    # A calibration session holds teleop off for as long as it runs, so an abandoned one - a
    # closed browser tab mid-sweep - must not be able to do so forever. On expiry the session is
    # cancelled, the previous values stay in effect and teleop resumes.
    calibration_timeout_s: 300
    # How often rc/calibration/state is republished while a session runs. Only the heartbeat:
    # every phase change and every service call publishes immediately regardless.
    calibration_state_rate_hz: 5.0

    # A calibration is gated on the rover's REAL E-Stop, read off
    # hardware_interface/gpio_state, not on the operator's word for it. "Engaged" means any of
    # the motion-inhibiting stops is active - hardware button, software button, motor-driver
    # fault or the safety latch - which is the same set rover_twist_mux locks motion on, so
    # "safe to calibrate" means exactly "twist_mux would refuse to move".
    #
    # These are active-high: `true` is engaged. The one inverted field in that message is
    # gpio_pin_motor_contactor_engaged, which is not an E-Stop bit and is not used here.
    #
    # How long a gpio_state sample stays trustworthy. It is published at 20 Hz, so a second is 20
    # missed messages. Past it the state is "cannot verify" and a calibration is REFUSED rather
    # than assumed safe - which also means no calibration without rover_hardware_interface
    # running, so not on a bench and not in simulation.
    e_stop_state_timeout_s: 1.0
    # How long the E-Stop must stay un-engaged before a running calibration is cancelled. Not
    # zero: the driver reports a Modbus read error as "clear", and the IO behind it only
    # refreshes at 2 Hz, so a single not-engaged sample is a hiccup rather than consent being
    # withdrawn - and cancelling on it would throw away a measurement that took minutes.
    e_stop_grace_s: 1.0

    # Stick axes. Out limits match rover_drive_controller's linear.x / angular.z caps in
    # rover_controller/config/wheel_01_controller.yaml: anything above them is clipped per axis
    # by diff_drive, which bends the commanded arc.
    linear_x_channel: 3
    linear_x_out_min: -1.2    # m/s
    linear_x_out_max: 1.2     # m/s
    linear_x_invert: false

    angular_z_channel: 1
    angular_z_out_min: -1.0   # rad/s
    angular_z_out_max: 1.0    # rad/s
    angular_z_invert: true

    # Stick expo per axis: (1 - e) * m + e * m^3 on the normalized deflection m. 0 = linear,
    # 1 = softest. Small moves give much less speed (30 % turn stick -> 16 % at 0.5), full stick
    # is still out_min/out_max. Same values as the web joystick (ROVER_DRIVE_EXPO_*). This is ON
    # TOP of any expo in the transmitter model - keep the radio's expo at 0 %. Calibration is
    # unaffected: it measures raw endpoints and midpoint, expo only reshapes the curve between.
    linear_x_expo: 0.3
    angular_z_expo: 0.5

    # Outer-wheel rim speed budget. Stick commands with |v| + |w| * track / 2 above this are scaled
    # down as a whole (same factor on v and w), so the rover drives the arc the sticks asked for,
    # just slower. 1.7 m/s = 10.3 rad/s at r = 0.1651, under the 10.958 rad/s URDF wheel limit with
    # room for the wheel PID's feedforward + I trim. 0.0 disables.
    max_wheel_rim_speed: 1.7        # m/s
    # wheel_separation * wheel_separation_multiplier from wheel_01_controller.yaml
    # (0.62602 * 1.63). Update together with the multiplier.
    effective_track_width: 1.0204   # m

    # A stop (stick centred, link lost, calibration inhibit) publishes zeros for this long and then
    # goes silent, so twist_mux falls through to its next source. A burst rather than one message,
    # so a single lost zero cannot leave the last motion command standing until the mux timeout.
    # 300 ms = 15 control ticks. 0 = a single zero.
    zero_burst_duration_ms: 300

    # Switch channels. A channel below channel_switch_threshold counts as "low": low on
    # e_stop_channel sets the SW User E-Stop, high resets it; low on
    # e_stop_latch_reset_channel resets the E-Stop latch.
    e_stop_channel: 5
    e_stop_latch_reset_channel: 4
    # Deliberately an absolute raw value, not a fraction of the calibrated range: a switch sits at
    # the ends of its travel, so comparing raw counts is right, and re-deriving a safety-critical
    # threshold from a measurement an operator has just taken is a worse failure mode than leaving
    # it explicit. What calibration does buy is a startup warning when this value has fallen
    # outside a switch channel's measured range - which would leave that switch reading one
    # position forever.
    channel_switch_threshold: 500
    # Control ticks (20 ms each) spent at startup learning where the switches rest, so their
    # resting position doesn't fire a spurious E-Stop set/reset. 100 = 2 s.
    switch_settle_frames: 100

    # RC link failsafe. When the link is judged lost the node publishes a short zero burst
    # (zero_burst_duration_ms) and then goes silent, so the rover stops immediately and twist_mux falls through to its next source.
    # The link is healthy only while all of these hold:
    #   - an rc/channels frame arrived within channel_timeout_ms (at the A1's measured 250 Hz
    #     packet rate, 200 ms is ~50 missed frames - it was sized as 10 missed frames back when
    #     the link was assumed to be 50 Hz. Keep it at 200: the right question is how long the
    #     rover may keep driving on stale sticks, which is wall-clock, not a frame count);
    #   - if require_link_stats: an rc/link report arrived within link_stats_timeout_ms, and the
    #     uplink link quality (CRSF LQ, %) has not dropped below link_quality_lost_below since it
    #     was last at or above link_quality_recovered_at (hysteresis, so it can't flap).
    # Freshness alone can't catch a receiver in failsafe that keeps sending held channel values;
    # link quality can. There is no reason to disable this on ELRS hardware: the receiver always
    # sends LINK_STATISTICS (0x14) and nothing can turn that off. Only set false if some other
    # CRSF source is wired in that does not send them.
    #
    # INITIAL VALUES - tune on the rover: `ros2 topic hz /rover/rc/link` for the stats rate (it follows
    # the ELRS telemetry ratio), and `ros2 topic echo /rover/rc/link` (uplink_status) while walking the
    # transmitter out of range for the LQ thresholds.
    channel_timeout_ms: 200
    link_stats_timeout_ms: 1000
    require_link_stats: true
    link_quality_lost_below: 30
    link_quality_recovered_at: 50

    # Diagnostics: "RC channels rate" warns when decoded CRSF frames arrive more than
    # rc_channels_rate_tolerance (fraction) away from rc_channels_expected_hz, or when no frames
    # arrive (WARN only - link loss is reported by "RC link", a dead byte stream by "RC serial
    # link"). This counts frames decoded off the byte stream, not messages on a topic, so it
    # measures the receiver's real packet rate: set it to what `ros2 topic hz /rover/rc/channels`
    # reports. Measured 2026-09-20 on the A1: ~243 Hz, i.e. the ELRS 250 Hz packet-rate mode, not
    # the 50 Hz this was originally set to - which is what made this diagnostic read "Frequency
    # too high". Re-measure and update BOTH this and the failsafe note above if the transmitter's
    # packet rate is ever changed; the tolerance below is wide enough (200-300 Hz) that the 2.8%
    # the real rate sits off the nominal 250 does not matter. Read once at startup.
    rc_channels_expected_hz: 250.0
    rc_channels_rate_tolerance: 0.2
