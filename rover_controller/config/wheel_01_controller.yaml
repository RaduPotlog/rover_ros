# Wheel-speed loop: rover_drive_controller -> pid_controller_<wheel> -> hardware.
# diff_drive writes each PID's reference interface (its wheel names are
# "<pid controller>/<joint>"), and each PID closes the loop on the encoder velocity.
# The launch file spawns the PIDs named there together with the drive controller.
# The PIDs are rover_controller/SeededPidController, not the stock pid_controller/PidController:
# the stock one exports NaN until its first update, the chained diff_drive reads that on its
# first cycle ("Either the left or right wheel velocity is invalid"), and controller_manager
# then deactivates the whole chain - on the real rover, every single activation.
# See include/rover_controller/seeded_pid_controller.hpp.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 50

      # Topic remaps live here, not on ros2_control_node. controller_manager creates
      # every controller as its own node with use_global_arguments=false, so
      # command-line remaps given to ros2_control_node (launch `remappings=`, or
      # gz_ros2_control <remapping> tags) never reach the controllers.
      # `<controller>.node_options_args` are that controller node's own --ros-args.
      # Remap targets are relative, so they follow the controller manager's namespace.

      rover_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
        node_options_args: ["-r", "~/transition_event:=_rover_joint_state_broadcaster/transition_event"]
   
      pid_controller_rl_wheel_base_to_rl_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_rl_wheel_base_to_rl_wheel_joint/transition_event"]

      pid_controller_rr_wheel_base_to_rr_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_rr_wheel_base_to_rr_wheel_joint/transition_event"]

      pid_controller_fl_wheel_base_to_fl_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_fl_wheel_base_to_fl_wheel_joint/transition_event"]

      pid_controller_fr_wheel_base_to_fr_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_fr_wheel_base_to_fr_wheel_joint/transition_event"]
            
      rover_drive_controller:
        type: diff_drive_controller/DiffDriveController
        node_options_args: ["-r", "~/cmd_vel:=cmd_vel",
                            "-r", "~/odom:=odometry/wheels",
                            "-r", "~/transition_event:=_rover_drive_controller/transition_event"]
      
      rover_imu_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
        node_options_args: ["-r", "~/imu:=imu/data",
                            "-r", "~/transition_event:=_rover_imu_broadcaster/transition_event"]

  # Wheel PID gains. Units: rad/s in, rad/s out. Same values on all four wheels except the front-right
  # feedforward (see below). p/i/d were tuned
  # with wheel_step_response, wheels lifted; the clamps and the integral reference on the ground.
  # The hardware command is already rad/s scaled to duty (open loop), so feedforward_gain 1.0
  # carries the bulk and PID only trims load/battery/slip error. p = i = d = 0 with feedforward
  # 1.0 is exactly the old open-loop behaviour - use it for A/B runs:
  #   ros2 param set <ns>/pid_controller_<wheel> gains.<joint>.p 0.0   (and .i, .d)
  # fr feedforward_gain 0.96 (others 1.0): open loop (2026-10-06, wheels lifted) the fr plant alone
  # overshoots 5-8 % at +0.60/+0.80 m/s while fl/rl/rr do not. Trimming fr's feedforward cut its
  # closed-loop overshoot from 9.7/11.8 % to 7.7/6.2 % (two runs each at 50 Hz); median worst case
  # stayed 4.7-4.9 %, speed error <= 1.1 %. Re-check on the ground.
  # u_clamp is the hardware full-duty speed (2800 rpm / 23.3 = 12.58 rad/s).
  # save_i_term false: the integral is cleared each time the PIDs are (re)activated
  # (e-stop, controller switch), so a stale I-term never carries into the next drive.
  #
  # Why these values (encoders are 10 Hz, so dead time is ~0.2 s and loop gain must stay low):
  #   p 0.05  - P is nearly useless here: p = 1.0 rang the loop to 40-90 % overshoot. Keep it small.
  #   i 1.0   - the integral does all the steady-state work. Open loop the feedforward is ~21 %
  #             slow at 0.2 m/s (friction/deadband) and ~3 % fast at 0.8 m/s, so a single
  #             feedforward scale cannot fix both and the integral is genuinely needed.
  #   d 0.04  - damps the overshoot the integral causes without touching steady state. There is
  #             no derivative filter, so this is near the noise limit: d = 0.08 amplified encoder
  #             quantisation and made overshoot much WORSE (up to 29 %). Do not raise it.
  #   i_clamp - with the plain integral, this bounded overshoot (it wound up through the dead
  #             time), so the lifted tuning used 0.25 front / 0.33 rear. With the model-reference
  #             integral below it only has to cover the persistent load error: 2.0 (see 2026-10-02).
  #
  # On the ground (2026-09-29) straight steps were fine, but in-place turns ran 37-56 % under the
  # reference with every I-term pinned at its clamp (skid-steer needs ~+2 rad/s), and raising
  # the clamp to fix that took straight-step overshoot to 17-23 %. Two wheel-loop options,
  # implemented in SeededPidController, address this (all runtime-settable with ros2 param set):
  #   stop_at_zero_reference  - at a zero reference, send exactly 0 and clear the integral. The
  #             DCC1000 brakes only at a target of exactly 0; a leftover integral kept the brake
  #             off after every stop (and made the wheels creep with larger clamps).
  #   integral_reference_delay / _time_constant - the I-term integrates (reference delayed by
  #             the delay, then lagged by the time constant) - measurement instead of the raw
  #             error. Shaped like the plant's own step response, so the error the plant removes
  #             by itself no longer winds the integral up, while a persistent load error (skid
  #             turns, friction) still integrates fully. 0 / 0 = the plain upstream integral.
  #             If the model is SLOWER than the plant, the integral winds the wrong way on every
  #             rise and leaves a slow tail - re-fit it whenever the motor ramp changes.
  #   scale_integral_with_reference - the integral fades with |reference| below the largest
  #             reference since the last stop (restored if it comes back up, cleared on reversal).
  #             A skid turn's ~1.5 rad/s of trim otherwise kept pushing through the whole
  #             ramp-down, and the turn ended late.
  #
  # Ground tune 2026-10-02 (motor_acceleration 10.0, 26.6 V, wheel_step_response runs): dead time
  # 0.17-0.22 s. The old 0.25 / 0.15 s model (fitted at ramp 1-2) was now slower than the plant
  # (t90 ~1.5 s at 0.5 m/s); 0.15 / 0.08 s gives t90 ~0.6 s. i_clamp 2.0 took in-place turns from
  # 32-53 % under the reference to 5-8 % (turn overshoot 7-15 %), while straight steps stayed at
  # overshoot <= 4.3 % and |error| <= 1.7 % (0.3-0.8 m/s) - straight driving uses only ~0.4 of it.
  # d 0.04 does not chatter at the faster ramp. During a turn's ramp-down the integral still pushed
  # 1.3-1.5 rad/s, so the wheels were at 1-4 rad/s when the reference reached 0 (turns ended
  # ~0.3 s late): scale_integral_with_reference.
  pid_controller_rl_wheel_base_to_rl_wheel_joint:
    ros__parameters:

      dof_names:
        - rl_wheel_base_to_rl_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces: 
        - velocity
        
      # SeededPidController wheel loop (see the gains comment above).
      stop_at_zero_reference: true
      integral_reference_delay: 0.15
      integral_reference_time_constant: 0.08
      scale_integral_with_reference: true

      gains:
        rl_wheel_base_to_rl_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -2.0, "i_clamp_max": 2.0, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}

  pid_controller_rr_wheel_base_to_rr_wheel_joint:
    ros__parameters:

      dof_names:
        - rr_wheel_base_to_rr_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces:
        - velocity
        
      # SeededPidController wheel loop (see the gains comment above).
      stop_at_zero_reference: true
      integral_reference_delay: 0.15
      integral_reference_time_constant: 0.08
      scale_integral_with_reference: true

      gains:
        rr_wheel_base_to_rr_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -2.0, "i_clamp_max": 2.0, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}

  pid_controller_fl_wheel_base_to_fl_wheel_joint:
    ros__parameters:

      dof_names:
        - fl_wheel_base_to_fl_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces:
        - velocity
        
      # SeededPidController wheel loop (see the gains comment above).
      stop_at_zero_reference: true
      integral_reference_delay: 0.15
      integral_reference_time_constant: 0.08
      scale_integral_with_reference: true

      gains:
        fl_wheel_base_to_fl_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -2.0, "i_clamp_max": 2.0, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}

  pid_controller_fr_wheel_base_to_fr_wheel_joint:
    ros__parameters:

      dof_names:
        - fr_wheel_base_to_fr_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces:
        - velocity
        
      # SeededPidController wheel loop (see the gains comment above).
      stop_at_zero_reference: true
      integral_reference_delay: 0.15
      integral_reference_time_constant: 0.08
      scale_integral_with_reference: true

      gains:
        fr_wheel_base_to_fr_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 0.96, "i_clamp_min": -2.0, "i_clamp_max": 2.0, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}
        
  # Per-controller update rates. The controller_manager loop and the wheel PIDs run at 50 Hz:
  # the encoders only report every 100 ms (10 Hz), so 100 Hz just re-ran the PIDs on stale
  # feedback 9 cycles in 10 (and made the D term spike on each fresh sample) against ~0.2 s of
  # dead time.
  # Everything that only publishes runs at the rate its consumers use, because each message
  # crosses the Zenoh router to other containers. Each rate must divide 50 evenly
  # (test/test_wheel_geometry.py), or controller_manager updates it at an uneven period.
  #   joint_states  25 Hz - the encoders are 10 Hz, so wheel positions change at most every
  #                         100 ms. robot_state_publisher turns each message into /tf,
  #                         which every TF listener on the rover receives.
  #   imu/data      50 Hz - rover_ekf_node runs at 50 Hz.
  #   odometry/wheels 50 Hz - diff_drive publishes odometry every update (it has no separate
  #                         publish rate); the EKF runs at 50 Hz.
  rover_joint_state_broadcaster:
    ros__parameters:
      update_rate: 25

  rover_imu_broadcaster:
    ros__parameters:
      update_rate: 50
      sensor_name: "<namespace>/imu"
      frame_id: "<namespace>/imu_link"
      static_covariance_orientation: [1.8e-3, 0.0, 0.0, 0.0, 1.8e-3, 0.0, 0.0, 0.0, 1.8e-3]
      static_covariance_angular_velocity: [1.0e-4, 0.0, 0.0, 0.0, 1.0e-4, 0.0, 0.0, 0.0, 1.0e-4]
      static_covariance_linear_acceleration: [7.6e-4, 0.0, 0.0, 0.0, 7.6e-4, 0.0, 0.0, 0.0, 7.6e-4]

  rover_drive_controller:
    ros__parameters:
      update_rate: 50

      # Chained through the wheel PIDs: "<pid controller>/<joint>" -> the PID's reference
      # (command) and state interfaces. Plain joint names here drive the wheels open loop.
      left_wheel_names: ["pid_controller_rl_wheel_base_to_rl_wheel_joint/rl_wheel_base_to_rl_wheel_joint",
                         "pid_controller_fl_wheel_base_to_fl_wheel_joint/fl_wheel_base_to_fl_wheel_joint"]
      right_wheel_names: ["pid_controller_rr_wheel_base_to_rr_wheel_joint/rr_wheel_base_to_rr_wheel_joint",
                          "pid_controller_fr_wheel_base_to_fr_wheel_joint/fr_wheel_base_to_fr_wheel_joint"]

      wheels_per_side: 2
      # Must match rover_description/config/wheel_01.yaml (enforced by test/test_wheel_geometry.py)
      wheel_separation: 0.617
      wheel_radius: 0.1651

      # Calibrated as 1.63 against the old 0.62602 separation; rescaled to the measured 0.615 so
      # the effective track stays 0.62602 * 1.63 = 1.020 m and the odometry yaw scale is unchanged.
      wheel_separation_multiplier: 1.659

      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      odom_frame_id: odom
      base_frame_id: base_footprint
      tf_frame_prefix: "~"
      twist_covariance_diagonal: [5.4e-5, 5.4e-5, 0.0, 0.0, 0.0, 1.9e-4]

      open_loop: false

      position_feedback: false
      velocity_rolling_window_size: 1

      enable_odom_tf: false

      cmd_vel_timeout: 0.5
      # Nothing consumes ~/cmd_vel_out; leave it off rather than publish it at the update rate.
      publish_limited_velocity: false

      # linear.x and angular.z are limited independently, so the outer wheel rim speed can reach
      #   v + w * (wheel_separation * wheel_separation_multiplier) / 2  =  v + w * 0.5102
      # 0.95 + 1.5 * 0.5102 = 1.715 m/s (10.39 rad/s at r = 0.1651), under the URDF joint limit
      # (10.958 rad/s). Linear was cut from 1.2 so angular could rise from 1.0 to 1.5: 1.0 rad/s
      # did not give the in-place turn enough wheel duty.
      # The wheel PIDs' output is feedforward * reference + P + I + D, and u_clamp only bounds the
      # P + I + D part, so up to ~i_clamp (2.0) of trim rides on top of the reference: 10.39 + 2.0
      # = 12.39 rad/s of command, under full duty (u_clamp 12.58). That trim only builds up while
      # the wheel runs SLOWER than its reference (skid turns, load), so the wheel speed itself stays
      # within the reference and the joint limit. Both bounds are enforced by
      # test/test_wheel_geometry.py. rover_crsf_teleop scales stick commands against the same
      # budget (max_wheel_rim_speed / effective_track_width).
      linear:
        x:
          max_velocity: 0.95 # m/s
          min_velocity: -0.95 # m/s
          max_acceleration: 2.7 # m/s^2
          max_deceleration: -2.7 # m/s^2
          max_acceleration_reverse: -2.7 # m/s^2
          max_deceleration_reverse: 2.7 # m/s^2
          max_jerk: .NAN # m/s^3
          min_jerk: .NAN # m/s^3

      angular:
        z:
          max_velocity: 1.5 # rad/s
          min_velocity: -1.5 # rad/s
          max_acceleration: 3.74 # rad/s^2
          max_deceleration: -3.74 # rad/s^2
          max_acceleration_reverse: -3.74 # rad/s^2
          max_deceleration_reverse: 3.74 # rad/s^2
          max_jerk: .NAN # rad/s^3
          min_jerk: .NAN # rad/s^3
