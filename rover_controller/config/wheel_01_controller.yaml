# Wheel-speed loop: rover_drive_controller -> pid_controller_<wheel> -> hardware.
# diff_drive writes each PID's reference interface (its wheel names are
# "<pid controller>/<joint>"), and each PID closes the loop on the encoder velocity.
# The launch file spawns the PIDs named there together with the drive controller.
# The PIDs are rover_controller/SeededPidController, not the stock pid_controller/PidController:
# the stock one exports NaN until its first update, the chained diff_drive reads that on its
# first cycle ("Either the left or right wheel velocity is invalid"), and controller_manager
# then deactivates the whole chain - on the real rover, every single activation.
# See include/rover_controller/seeded_pid_controller.hpp.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      # Topic remaps live here, not on ros2_control_node. controller_manager creates
      # every controller as its own node with use_global_arguments=false, so
      # command-line remaps given to ros2_control_node (launch `remappings=`, or
      # gz_ros2_control <remapping> tags) never reach the controllers.
      # `<controller>.node_options_args` are that controller node's own --ros-args.
      # Remap targets are relative, so they follow the controller manager's namespace.

      rover_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
        node_options_args: ["-r", "~/transition_event:=_rover_joint_state_broadcaster/transition_event"]
   
      pid_controller_rl_wheel_base_to_rl_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_rl_wheel_base_to_rl_wheel_joint/transition_event"]

      pid_controller_rr_wheel_base_to_rr_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_rr_wheel_base_to_rr_wheel_joint/transition_event"]

      pid_controller_fl_wheel_base_to_fl_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_fl_wheel_base_to_fl_wheel_joint/transition_event"]

      pid_controller_fr_wheel_base_to_fr_wheel_joint:
        type: rover_controller/SeededPidController
        node_options_args: ["-r", "~/transition_event:=_pid_controller_fr_wheel_base_to_fr_wheel_joint/transition_event"]
            
      rover_drive_controller:
        type: diff_drive_controller/DiffDriveController
        node_options_args: ["-r", "~/cmd_vel:=cmd_vel",
                            "-r", "~/odom:=odometry/wheels",
                            "-r", "~/transition_event:=_rover_drive_controller/transition_event"]
      
      rover_imu_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
        node_options_args: ["-r", "~/imu:=imu/data",
                            "-r", "~/transition_event:=_rover_imu_broadcaster/transition_event"]

  # Wheel PID gains. Units: rad/s in, rad/s out. Same p/i/d on all four; i_clamp differs
  # front/rear (see below). Tuned with wheel_step_response, wheels lifted.
  # The hardware command is already rad/s scaled to duty (open loop), so feedforward_gain 1.0
  # carries the bulk and PID only trims load/battery/slip error. p = i = d = 0 with feedforward
  # 1.0 is exactly the old open-loop behaviour - use it for A/B runs:
  #   ros2 param set <ns>/pid_controller_<wheel> gains.<joint>.p 0.0   (and .i, .d)
  # u_clamp is the hardware full-duty speed (2800 rpm / 23.3 = 12.58 rad/s).
  # save_i_term false: the integral is cleared each time the PIDs are (re)activated
  # (e-stop, controller switch), so a stale I-term never carries into the next drive.
  #
  # Why these values (encoders are 20 Hz, so dead time is ~0.2 s and loop gain must stay low):
  #   p 0.05  - P is nearly useless here: p = 1.0 rang the loop to 40-90 % overshoot. Keep it small.
  #   i 1.0   - the integral does all the steady-state work. Open loop the feedforward is ~21 %
  #             slow at 0.2 m/s (friction/deadband) and ~3 % fast at 0.8 m/s, so a single
  #             feedforward scale cannot fix both and the integral is genuinely needed.
  #   d 0.04  - damps the overshoot the integral causes without touching steady state. There is
  #             no derivative filter, so this is near the noise limit: d = 0.08 amplified encoder
  #             quantisation and made overshoot much WORSE (up to 29 %). Do not raise it.
  #   i_clamp - this, not i, is what bounds overshoot: the integral winds up through the dead
  #             time and saturates, so peak overshoot ~ i_clamp / step amplitude. The required
  #             trim is roughly constant in rad/s while the overshoot budget is a percentage,
  #             so the clamp is set per wheel from measurement: fl/fr overshoot most and need
  #             0.25; rl/rr need ~0.33 to beat low-speed friction and have the headroom for it.
  # Measured with these gains (median of 4 wheels, wheels lifted, 3 consecutive runs):
  # overshoot <= 9.6 % and |steady-state error| <= 2.3 % on every step. Re-check on the ground.
  pid_controller_rl_wheel_base_to_rl_wheel_joint:
    ros__parameters:

      dof_names:
        - rl_wheel_base_to_rl_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces: 
        - velocity
        
      gains:
        rl_wheel_base_to_rl_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -0.33, "i_clamp_max": 0.33, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}

  pid_controller_rr_wheel_base_to_rr_wheel_joint:
    ros__parameters:

      dof_names:
        - rr_wheel_base_to_rr_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces:
        - velocity
        
      gains:
        rr_wheel_base_to_rr_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -0.33, "i_clamp_max": 0.33, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}

  pid_controller_fl_wheel_base_to_fl_wheel_joint:
    ros__parameters:

      dof_names:
        - fl_wheel_base_to_fl_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces:
        - velocity
        
      gains:
        fl_wheel_base_to_fl_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -0.25, "i_clamp_max": 0.25, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}

  pid_controller_fr_wheel_base_to_fr_wheel_joint:
    ros__parameters:

      dof_names:
        - fr_wheel_base_to_fr_wheel_joint

      command_interface: velocity

      reference_and_state_interfaces:
        - velocity
        
      gains:
        fr_wheel_base_to_fr_wheel_joint: {"p": 0.05, "i": 1.0, "d": 0.04, "feedforward_gain": 1.0, "i_clamp_min": -0.25, "i_clamp_max": 0.25, "u_clamp_min": -12.58, "u_clamp_max": 12.58, "antiwindup_strategy": "back_calculation", "save_i_term": false}
        
  # Per-controller update rates. The controller_manager loop and the wheel PIDs stay at 100 Hz;
  # everything that only publishes runs at the rate its consumers use, because each message
  # crosses the Zenoh router to other containers. Each rate must divide 100 evenly
  # (test/test_wheel_geometry.py), or controller_manager updates it at an uneven period.
  #   joint_states  20 Hz - the encoders are 20 Hz; robot_state_publisher turns each message
  #                         into /tf, which every TF listener on the rover receives.
  #   imu/data      50 Hz - rover_ekf_node runs at 50 Hz.
  #   odometry/wheels 50 Hz - diff_drive publishes odometry every update (it has no separate
  #                         publish rate); the EKF runs at 50 Hz. Its wheel references still
  #                         feed the 100 Hz PIDs, which hold the last one between updates.
  rover_joint_state_broadcaster:
    ros__parameters:
      update_rate: 20

  rover_imu_broadcaster:
    ros__parameters:
      update_rate: 50
      sensor_name: "<namespace>/imu"
      frame_id: "<namespace>/imu_link"
      static_covariance_orientation: [1.8e-3, 0.0, 0.0, 0.0, 1.8e-3, 0.0, 0.0, 0.0, 1.8e-3]
      static_covariance_angular_velocity: [1.0e-4, 0.0, 0.0, 0.0, 1.0e-4, 0.0, 0.0, 0.0, 1.0e-4]
      static_covariance_linear_acceleration: [7.6e-4, 0.0, 0.0, 0.0, 7.6e-4, 0.0, 0.0, 0.0, 7.6e-4]

  rover_drive_controller:
    ros__parameters:
      update_rate: 50

      # Chained through the wheel PIDs: "<pid controller>/<joint>" -> the PID's reference
      # (command) and state interfaces. Plain joint names here drive the wheels open loop.
      left_wheel_names: ["pid_controller_rl_wheel_base_to_rl_wheel_joint/rl_wheel_base_to_rl_wheel_joint",
                         "pid_controller_fl_wheel_base_to_fl_wheel_joint/fl_wheel_base_to_fl_wheel_joint"]
      right_wheel_names: ["pid_controller_rr_wheel_base_to_rr_wheel_joint/rr_wheel_base_to_rr_wheel_joint",
                          "pid_controller_fr_wheel_base_to_fr_wheel_joint/fr_wheel_base_to_fr_wheel_joint"]

      wheels_per_side: 2
      # Must match rover_description/config/wheel_01.yaml (enforced by test/test_wheel_geometry.py)
      wheel_separation: 0.62602
      wheel_radius: 0.1651

      wheel_separation_multiplier: 1.63

      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      odom_frame_id: odom
      base_frame_id: base_footprint
      tf_frame_prefix: "~"
      twist_covariance_diagonal: [5.4e-5, 5.4e-5, 0.0, 0.0, 0.0, 1.9e-4]

      open_loop: false

      position_feedback: false
      velocity_rolling_window_size: 1

      enable_odom_tf: false

      cmd_vel_timeout: 0.5
      # Nothing consumes ~/cmd_vel_out; leave it off rather than publish it at the update rate.
      publish_limited_velocity: false

      # linear.x and angular.z are limited independently, so the outer wheel rim speed can reach
      #   v + w * (wheel_separation * wheel_separation_multiplier) / 2  =  v + w * 0.5102
      # Keep that <= 1.7 m/s (10.3 rad/s at r = 0.1651), under the URDF joint limit (10.958 rad/s).
      # The margin is for the wheel PIDs: their output is feedforward * reference + P + I + D,
      # and u_clamp only bounds the P + I + D part, so up to ~i_clamp (0.25 front, 0.33 rear)
      # of trim rides on top of the reference. Enforced by test/test_wheel_geometry.py. rover_crsf_teleop scales stick
      # commands against the same budget (max_wheel_rim_speed / effective_track_width).
      linear:
        x:
          max_velocity: 1.2 # m/s
          min_velocity: -1.2 # m/s
          max_acceleration: 2.7 # m/s^2
          max_deceleration: -2.7 # m/s^2
          max_acceleration_reverse: -2.7 # m/s^2
          max_deceleration_reverse: 2.7 # m/s^2
          max_jerk: .NAN # m/s^3
          min_jerk: .NAN # m/s^3

      angular:
        z:
          max_velocity: 1.0 # rad/s
          min_velocity: -1.0 # rad/s
          max_acceleration: 3.74 # rad/s^2
          max_deceleration: -3.74 # rad/s^2
          max_acceleration_reverse: -3.74 # rad/s^2
          max_deceleration_reverse: 3.74 # rad/s^2
          max_jerk: .NAN # rad/s^3
          min_jerk: .NAN # rad/s^3
